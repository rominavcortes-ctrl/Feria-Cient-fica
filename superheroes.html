<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Superhéroes de las Vacunas</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { 
      margin: 0; padding: 0; 
      width: 100vw; height: 100vh; 
      overflow: hidden; 
      background: #eef2f7; 
      display: flex; flex-direction: column; 
      align-items: center; justify-content: center; 
    }

    /* Globo de texto interactivo */
    .speech-box {
      position: absolute;
      top: 20px;
      left: 15px;
      right: 15px;
      background: rgba(255, 255, 255, 0.95);
      padding: 16px;
      border-radius: 16px;
      border: 3px solid #007bff;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      text-align: center;
      font-size: 15px;
      color: #2c3e50;
      z-index: 10;
      min-height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Contenedor con animación flotante */
    .character-container {
      width: 100%;
      height: 55vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .character-img {
      max-height: 100%;
      max-width: 85%;
      filter: drop-shadow(0px 10px 20px rgba(0,0,0,0.25));
      animation: float 3s ease-in-out infinite;
      transition: all 0.3s ease;
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }

    /* Panel de control inferior */
    .control-panel {
      position: absolute;
      bottom: 25px;
      display: flex;
      gap: 10px;
      background: rgba(255, 255, 255, 0.95);
      padding: 10px 14px;
      border-radius: 30px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      z-index: 10;
    }

    .btn-hero {
      border: none;
      background: #007bff;
      color: white;
      padding: 10px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s;
    }

    .btn-hero.active {
      background: #28a745;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <!-- Globo de diálogo -->
  <div class="speech-box" id="speechText">
    🛡️ <b>Superhéroe 1:</b> ¡Las vacunas son 100% seguras! Le enseñan a tu cuerpo a defenderse como un entrenamiento, ¡sin hacerte enfermar!
  </div>

  <!-- Imagen inicial del superhéroe 1 -->
  <div class="character-container">
    <img id="heroImg" src="superheroesn1.png" alt="Superhéroes de las vacunas" class="character-img">
  </div>

  <!-- Botones de intercambio -->
  <div class="control-panel">
    <button class="btn-hero active" onclick="cambiarHeroe(1)">Héroe 1</button>
    <button class="btn-hero" onclick="cambiarHeroe(2)">Héroe 2</button>
    <button class="btn-hero" onclick="cambiarHeroe(3)">Héroe 3</button>
  </div>

  <script>
    const datosHeroes = {
      1: {
        img: 'superheroesn1.png',
        texto: '🛡️ <b>Superhéroe 1:</b> ¡Las vacunas son 100% seguras! Le enseñan a tu cuerpo a defenderse como un entrenamiento, ¡sin hacerte enfermar!'
      },
      2: {
        img: 'superheroesn2.png',
        texto: '👥 <b>Superhéroe 2:</b> ¡Tu vacuna es un escudo para todos! Al vacunarte, proteges a tus amigos, abuelitos y a quienes te rodean.'
      },
      3: {
        img: 'superheroesn3.png',
        texto: '🦠 <b>Superhéroe 3:</b> ¡Un superpoder contra las enfermedades! Las vacunas le dan memoria a tu cuerpo para bloquear virus antes de que entren.'
      }
    };

    const heroImg = document.getElementById('heroImg');
    const speechText = document.getElementById('speechText');
    const buttons = document.querySelectorAll('.btn-hero');

    function cambiarHeroe(numero) {
      heroImg.src = datosHeroes[numero].img;
      speechText.innerHTML = datosHeroes[numero].texto;

      buttons.forEach((btn, index) => {
        if (index === numero - 1) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
    }
  </script>

</body>
</html>
