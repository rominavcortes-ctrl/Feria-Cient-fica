<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Realidad Aumentada - Feria Científica</title>
  <!-- Cargamos el visor 3D de Google -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    body { margin: 0; padding: 0; width: 100vw; height: 100vh; overflow: hidden; font-family: sans-serif; }
    model-viewer { width: 100%; height: 100%; background-color: #f5f5f5; }
  </style>
</head>
<body>

  <!-- Visor WebAR -->
  <model-viewer 
    src="Flu_NIH3D.glb" 
    alt="Modelo 3D Virus Gripal" 
    ar 
    ar-modes="webxr scene-viewer quick-look" 
    camera-controls 
    auto-rotate>
  </model-viewer>

</body>
</html>
